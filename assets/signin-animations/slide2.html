(function () {
  var DURATION = 10000;
  var clock = 0, rate = 1, running = false, last = null, frameCb = null;

  function anims() {
    try { return document.getAnimations ? document.getAnimations() : []; }

  function video() { return document.getElementById('bowls'); }
  function eachAnim(fn) {

  function applyRate(r) {

    var v = video(); if (v) { try { v.playbackRate = r; } catch (e) {} }

  function rewind() {
    eachAnim(function (a) { a.currentTime = 0; a.play(); });
    var v = video(); if (v) { try { v.currentTime = 0; } catch (e) {} }

  window.__slide = {
    durationMs: DURATION,
    play: function () {
      running = true; last = null;

    pause: function () {
      running = false;
      eachAnim(function (a) { a.pause(); });
      var v = video(); if (v) { try { v.pause(); } catch (e) {} }
    },
    seek: function (ms) {

    setRate: function (m) { rate = m > 0 ? m : 1; applyRate(rate); },
    onFrame: function (cb) { frameCb = cb; }
