    /* --- Canvas --- */
    /* The AnimatedSlide WebView injects CSS that forces html/body to #F23A53
       and fills width to viewport. We keep body transparent so the red shows
       through as the slide background. All layout is in the 540×1173 .canvas. */
    html, body {
      width: 540px;
      height: 1173px;
      overflow: hidden;
      background: transparent;
    }

    .canvas {
      width: 540px;
      height: 1173px;
      position: relative;
      /* Safe zones: top 70px (notch/status bar), bottom 150px (auth buttons) */
      padding: 80px 36px 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Header --- */
    .header {
      text-align: center;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeSlideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }
    .header h1 {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.15;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .header .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 4px;
    }

    /* --- Timeline wrapper --- */
    .timeline {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      margin-top: 18px;
    }

    /* Continuous connecting line behind all items */
    .timeline::before {
      content: '';
      position: absolute;
      left: 26px;
      top: 26px;
      bottom: 26px;
      width: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 2px;
    }

    /* --- Phase item --- */
    .phase {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      opacity: 0;
    }

    /* Staggered entrance animations */
    .phase:nth-child(1) { animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards; }
    .phase:nth-child(2) { animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards; }
    .phase:nth-child(3) { animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards; }
    .phase:nth-child(4) { animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards; }
    .phase:nth-child(5) { animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.25s forwards; }

    /* Node circle */
    .node {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 1;
    }
    .node span {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #F23A53;
      line-height: 1;
    }

    /* Phase card */
    .card {
      flex: 1;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px 16px 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(2px);
    }
    .card .phase-name {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      line-height: 1.25;
    }
    .card .phase-days {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 2px;
    }

    /* Last phase special accent */
    .phase:last-child .card {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .phase:last-child .phase-name {
      font-size: 20px;
    }

    /* --- Keyframes --- */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="header">
      <h1>The Road to Launch</h1>
      <div class="subtitle">~2–4 weeks to the App Store</div>
    </div>

    <div class="timeline">

      <div class="phase">
        <div class="node"><span>1</span></div>
        <div class="card">
          <div class="phase-name">App Store Connect setup</div>
          <div class="phase-days">1–3 days</div>
        </div>
      </div>

      <div class="phase">
        <div class="node"><span>2</span></div>
        <div class="card">
          <div class="phase-name">Production build + in-app purchases</div>
          <div class="phase-days">2–4 days</div>
        </div>
      </div>

      <div class="phase">
        <div class="node"><span>3</span></div>
        <div class="card">
          <div class="phase-name">TestFlight beta</div>
          <div class="phase-days">3–7 days</div>
        </div>
      </div>

      <div class="phase">
        <div class="node"><span>4</span></div>
        <div class="card">
          <div class="phase-name">Store listing &amp; App Review</div>
          <div class="phase-days">2–4 days</div>
        </div>
      </div>

      <div class="phase">
        <div class="node"><span>5</span></div>
        <div class="card">
          <div class="phase-name">Public launch 🎉</div>
          <div class="phase-days">2–3 days</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
